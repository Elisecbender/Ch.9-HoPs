<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Survey</title>
    <link rel="stylesheet" href="musicform.css">
</head>
<body>

    <form action="#" method="post">
        <fieldset>
            <legend>Your Information</legend>
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>
        </fieldset>

        <fieldset>
            <legend>Your Music Preferences</legend>
            <div>
                <label for="comments">Comments:</label>
                <textarea id="comments" name="comments" cols="60" rows="3"></textarea>
            </div>

            <fieldset>
                <legend>Favorite Music Genre</legend>
                <div>
                    <input type="radio" id="rock" name="genre" value="rock">
                    <label for="rock">Rock</label>
                </div>
                <div>
                    <input type="radio" id="pop" name="genre" value="pop">
                    <label for="pop">Pop</label>
                </div>
                <div>
                    <input type="radio" id="electronic" name="genre" value="electronic">
                    <label for="electronic">Electronic</label>
                </div>
                <div>
                    <input type="radio" id="hiphop" name="genre" value="hiphop">
                    <label for="hiphop">Hip Hop</label>
                </div>
            </fieldset>

            <div>
                <label for="favorite_artist">Favorite Artist:</label>
                <select id="favorite_artist" name="favorite_artist" size="3">
                    <option value="artist1">Artist 1</option>
                    <option value="artist2">Artist 2</option>
                    <option value="artist3">Artist 3</option>
                    <option value="artist4">Artist 4</option>
                </select>
            </div>

            <div>
                <label for="listen_date">Date You Listened:</label>
                <input type="date" id="listen_date" name="listen_date">
            </div>
        </fieldset>

        <div>
            <button type="submit">Submit Survey</button>
            <button type="reset">Reset Form</button>
        </div>
    </form>

    <footer>
        <p>Elise Bender</p>
        <p><a href="ecbender@mail.lipscomb.edu"></a></p>
    </footer>

</body>
</html>
